<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chaos Checkers</title>
  <meta name="theme-color" content="#1c1d21">
  <meta name="description" content="Checkers where jumping pieces earns you abilities.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chaos Checkers">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="menu" class="menu">
    <div class="corner-buttons">
      <button id="how-to-play" type="button" class="corner-btn" aria-label="How to Play" title="How to Play">❔</button>
      <button id="open-settings" type="button" class="corner-btn" aria-label="Settings" title="Settings">⚙️</button>
    </div>
    <div id="menu-tokens" class="menu-tokens" aria-hidden="true">
      <div class="token black"><div class="disc">
        <svg class="crown" viewBox="0 0 24 24"><path d="M3 18.5h18L19.6 8l-4.6 4.2L12 5l-3 7.2L4.4 8z"/></svg>
      </div></div>
      <div class="token red king"><div class="disc">
        <svg class="crown" viewBox="0 0 24 24"><path d="M3 18.5h18L19.6 8l-4.6 4.2L12 5l-3 7.2L4.4 8z"/></svg>
      </div></div>
    </div>
    <h1 class="title"><span class="title-top">Chaos</span><span class="title-main">Checkers</span></h1>
    <div id="menu-main" class="menu-buttons">
      <button id="play-bot" type="button" class="menu-btn primary">Play vs Bot</button>
      <button id="open-multiplayer" type="button" class="menu-btn">
        Multiplayer
        <small>Play with a friend</small>
      </button>
      <button id="open-global" type="button" class="menu-btn">
        Global Play
        <small>Play a random person</small>
      </button>
      <button id="install-app" type="button" class="menu-btn" hidden>
        Install
        <small>Add it to your home screen</small>
      </button>
    </div>
    <div id="menu-global" class="menu-buttons" hidden>
      <p class="menu-label">Global Play</p>
      <p class="choice-label">Board</p>
      <div id="global-board" class="choice-row"></div>
      <p class="choice-label">Size</p>
      <div id="global-size" class="choice-row"></div>
      <button id="find-match" type="button" class="menu-btn primary">Find a Match</button>
      <button type="button" class="menu-back" data-back="main">Back</button>
    </div>
    <div id="menu-search" class="menu-buttons" hidden>
      <p class="menu-label">Global Play</p>
      <p id="search-board" class="search-board"></p>
      <p id="global-status" class="menu-note" aria-live="polite"></p>
      <div class="search-orbit" aria-hidden="true">
        <div class="orbit-arm"><div class="token red"><div class="disc"></div></div></div>
        <div class="orbit-arm"><div class="token black"><div class="disc"></div></div></div>
      </div>
      <button id="cancel-search" type="button" class="menu-back search-back">Cancel</button>
    </div>
    <div id="menu-settings" class="menu-buttons" hidden>
      <p class="menu-label">Settings</p>
      <button id="toggle-sound" type="button" class="menu-btn setting-btn" role="switch" aria-checked="true">
        <span>Sound</span>
        <span class="switch" aria-hidden="true"></span>
      </button>
      <button id="remove-ads" type="button" class="menu-btn" hidden>
        Remove Ads
        <small>No more ads between games</small>
      </button>
      <button id="restore-purchases" type="button" class="menu-btn" hidden>
        Restore Purchases
        <small>Bought it before? Get it back here</small>
      </button>
      <a id="privacy-policy" class="menu-back" href="#" target="_blank" rel="noopener" hidden>Privacy Policy</a>
      <button type="button" class="menu-back" data-back="main">Back</button>
    </div>
    <div id="menu-multiplayer" class="menu-buttons" hidden>
      <p class="menu-label">Multiplayer</p>
      <button id="play-local" type="button" class="menu-btn">
        Same Device
        <small>Take turns on this screen</small>
      </button>
      <button id="open-online" type="button" class="menu-btn">
        Via Code
        <small>Share a code with a friend</small>
      </button>
      <button type="button" class="menu-back" data-back="main">Back</button>
    </div>
    <div id="menu-online" class="menu-buttons" hidden>
      <p class="menu-label">Play Online</p>
      <button id="create-game" type="button" class="menu-btn primary">
        Create Game
        <small>Get a code to share</small>
      </button>
      <button id="open-join" type="button" class="menu-btn">
        Join Game
        <small>Enter a friend's code</small>
      </button>
      <button type="button" class="menu-back" data-back="multiplayer">Back</button>
    </div>
    <div id="menu-create" class="menu-buttons" hidden>
      <p class="menu-label">Your code</p>
      <div id="code-display" class="code-display">····</div>
      <button id="share-code" type="button" class="menu-btn">Share code</button>
      <p id="create-status" class="menu-note">Getting a code…</p>
      <button type="button" class="menu-back" data-back="online">Cancel</button>
    </div>
    <div id="menu-join" class="menu-buttons" hidden>
      <p class="menu-label">Enter the code</p>
      <input id="code-input" class="code-input" type="text" inputmode="latin" autocomplete="off"
        autocapitalize="characters" spellcheck="false" maxlength="4" placeholder="CODE" aria-label="Game code">
      <button id="join-game" type="button" class="menu-btn primary">Join</button>
      <p id="join-status" class="menu-note"></p>
      <button type="button" class="menu-back" data-back="online">Back</button>
    </div>
    <div id="menu-difficulty" class="menu-buttons" hidden>
      <p class="menu-label">Choose difficulty</p>
      <button type="button" class="menu-btn level-easy" data-level="easy">
        Easy
        <small>Still learning</small>
      </button>
      <button type="button" class="menu-btn level-normal" data-level="normal">
        Normal
        <small>A fair fight</small>
      </button>
      <button type="button" class="menu-btn level-hard" data-level="hard">
        Hard
        <small>Thinks far ahead</small>
      </button>
      <button type="button" class="menu-back" data-back="main">Back</button>
    </div>
    <div id="menu-size" class="menu-buttons" hidden>
      <p class="menu-label">Choose a size</p>
      <div id="size-list" class="shape-list"></div>
      <button type="button" class="menu-back" data-back="difficulty">Back</button>
    </div>
    <div id="menu-shape" class="menu-buttons" hidden>
      <p class="menu-label">Choose a shape</p>
      <div id="shape-list" class="shape-list"></div>
      <button type="button" class="menu-back" data-back="size">Back</button>
    </div>
    <div id="menu-glitch" class="menu-buttons" hidden>
      <p class="menu-label glitch-label">?????</p>
      <button id="play-randy" type="button" class="menu-btn glitch-btn" data-text="RANDY">
        RANDY
        <small>no thoughts, only moves</small>
      </button>
      <button type="button" class="menu-back" data-back="main">Back</button>
    </div>
    <div id="menu-tooeasy" class="menu-buttons tint-gold" hidden>
      <p class="menu-label glitch-label">?????</p>
      <button id="play-tooeasy" type="button" class="menu-btn glitch-btn" data-text="TOO EASY BOT">
        TOO EASY BOT
        <small>definitely a normal bot</small>
      </button>
      <button type="button" class="menu-back" data-back="main">Back</button>
    </div>
  </section>

  <div id="screen-flash" class="screen-flash" hidden></div>

  <main id="game" class="game" hidden>
    <div id="bar-top" class="status-bar">
      <div class="status" aria-live="polite"></div>
      <div class="actions">
        <button type="button" class="react-toggle" aria-label="Send a reaction" title="Send a reaction">🙂</button>
        <button type="button" class="to-menu">Menu</button>
      </div>
    </div>
    <div id="panel-black" class="panel" data-color="black"></div>
    <div class="board">
      <div id="squares" class="squares"></div>
      <div id="pieces" class="pieces"></div>
    </div>
    <div id="panel-red" class="panel" data-color="red"></div>
    <div id="bar-bottom" class="status-bar">
      <div class="status" aria-live="polite"></div>
      <div class="actions">
        <button type="button" class="react-toggle" aria-label="Send a reaction" title="Send a reaction">🙂</button>
        <button type="button" class="to-menu">Menu</button>
      </div>
    </div>
  </main>

  <div id="reactions" class="reactions" hidden>
    <button type="button" data-react="👍">👍</button>
    <button type="button" data-react="😂">😂</button>
    <button type="button" data-react="😮">😮</button>
    <button type="button" data-react="😅">😅</button>
    <button type="button" data-react="🎉">🎉</button>
    <button type="button" data-react="🤔">🤔</button>
  </div>

  <div id="announce" class="announce" aria-live="assertive" hidden></div>

  <div id="versus" class="versus" hidden>
    <div class="versus-row">
      <div class="versus-player you"><div class="versus-avatar"></div><div class="versus-name"></div></div>
      <div class="versus-vs">VS</div>
      <div class="versus-player them"><div class="versus-avatar"></div><div class="versus-name"></div></div>
    </div>
    <p class="versus-board"></p>
  </div>

  <div id="reward" class="result" hidden>
    <div class="result-card reward-card" role="dialog" aria-labelledby="reward-title">
      <h2 id="reward-title" class="result-title dialog-title">Choose your reward</h2>
      <p id="reward-sub" class="result-sub"></p>
      <div id="reward-options" class="reward-options"></div>
      <button id="reward-reroll" type="button" class="reroll-btn" hidden>
        <span>🎲 Reroll</span>
        <small>Watch an ad for two different ones</small>
      </button>
      <div id="reward-swap" class="reward-swap" hidden>
        <p class="menu-label">Replace which one?</p>
        <div id="reward-held" class="reward-options"></div>
      </div>
      <button id="reward-skip" type="button" class="menu-back">No thanks</button>
    </div>
  </div>

  <div id="guide" class="result" hidden>
    <div class="result-card guide-card" role="dialog" aria-labelledby="guide-title">
      <h2 id="guide-title" class="result-title dialog-title">How to Play</h2>
      <div id="guide-body" class="guide-body"></div>
      <div class="menu-buttons">
        <button id="guide-close" type="button" class="menu-btn primary">Got it</button>
      </div>
    </div>
  </div>

  <div id="confirm" class="result" hidden>
    <div class="result-card" role="dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title" class="result-title dialog-title">Go to the menu?</h2>
      <p id="confirm-sub" class="result-sub"></p>
      <div class="menu-buttons">
        <button id="confirm-yes" type="button" class="menu-btn primary">Go to menu</button>
        <button id="confirm-no" type="button" class="menu-btn">Keep playing</button>
      </div>
    </div>
  </div>

  <div id="result" class="result" hidden>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div class="result-card" role="dialog" aria-labelledby="result-title">
      <div id="result-tokens" class="result-tokens" aria-hidden="true"></div>
      <h2 id="result-title" class="result-title"></h2>
      <p id="result-sub" class="result-sub"></p>
      <div class="menu-buttons">
        <button id="play-again" type="button" class="menu-btn primary">Play again</button>
        <button id="result-menu" type="button" class="menu-btn">Menu</button>
      </div>
      <button id="view-board" type="button" class="menu-back">View board</button>
    </div>
  </div>

  <script src="vendor/peerjs.min.js"></script>
  <script src="platform.js"></script>
  <script src="store.js"></script>
  <script src="ads.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
  <script src="bot.js"></script>
  <script src="net.js"></script>
  <script src="main.js"></script>
</body>
</html>
